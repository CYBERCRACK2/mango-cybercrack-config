exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once=systemctl --user start mango-session.target

# | Input Devices |
# Configure your input devices here. | https://mangowm.github.io/docs/configuration/input

enable_hotarea = 0
allow_tearing = 0 # V-sync basicamente
numlockon = 1
xkb_rules_layout = latam

# ENV
# Terminal config
exec = export PATH="$HOME/.local/bin:$PATH" &

# Trackpad settings
trackpad_natural_scrolling = 1

# If you want to disable pointer acceleration, uncomment the lines below.
accel_profile = 1
accel_speed = 0.2

# | XDG Portals |
# Screen Sharing 
#/usr/lib/xdg-desktop-portal-wlr &
#/usr/libexec/xdg-desktop-portal &
#/usr/libexec/xdg-desktop-portal-wlr &

#exec-once=/usr/lib/xdg-desktop-portal-wlr &
#exec-once=/usr/libexec/xdg-desktop-portal &
#exec-once=/usr/libexec/xdg-desktop-portal-wlr &



# | Layout |
# layouts | https://mangowm.github.io/docs/window-management/layouts
circle_layout = tile,scroller,deck,center_tile,dwindle

# Scrolling layout settings.
scroller_structs = 20
scroller_default_proportion = 0.5
scroller_focus_center = 0
scroller_prefer_center = 0
scroller_prefer_overspread = 0
edge_scroller_pointer_focus = 0
scroller_default_proportion_single = 1.0
scroller_proportion_preset = 0.5, 0.8, 1.0

# Master-Stack layout settings.
new_is_master = 1
default_mfact = 0.50
default_nmaster = 1
smartgaps = 0

# Dwindle layout settings
dwindle_hsplit = 2


# | Miscellaneous |
# https://mangowm.github.io/docs/configuration/miscellaneous
# - System & Hardware
syncobj_enable = 0
xwayland-persistence = 1
drag_tile_to_tile = 1
cursor_hide_timeout = 2


# | Look n Feel |
# theming | https://mangowm.github.io/docs/visuals

gappih = 5
gappiv = 5
gappoh = 5
gappov = 5
borderpx = 4
border_radius = 5

scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9

rootcolor = 0x000000ff
bordercolor = 0x000000ff 
focuscolor = 0x000000ff 
maximizescreencolor = 0x00000000
urgentcolor = 0xad401fff
scratchpadcolor = 0x516c93ff
globalcolor = 0xb153a7ff
overlaycolor = 0x000000ff

cursor_theme = capitaine-cursors
cursor_size = 23

blur = 1
blur_layer = 1
blur_optimized = 1
blur_params_num_passes = 2
blur_params_radius = 4
blur_params_noise = 0.04
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 1
shadow_only_floating = 0
shadows_size = 10
shadows_blur = 5
shadows_position_x = 0
shadows_position_y = 0
shadowscolor = 0x000000ff

animations = 1
layer_animations = 1
animation_type_open = slide
animation_type_close = slide
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
zoom_initial_ratio = 0.1
zoom_end_ratio = 0.5
fadein_begin_opacity = 0.3
fadeout_begin_opacity = 0.2
animation_duration_move = 300
animation_duration_open = 100
animation_duration_tag = 300
animation_duration_close = 400
animation_duration_focus = 0
animation_curve_open = 0.87, 0, 0.13, 1
animation_curve_move = 0.46, 1.0, 0.29, 1
animation_curve_tag = 0.46, 1.0, 0.29, 1
animation_curve_close = 0.87, 0, 0.13, 1
animation_curve_focus = 0.46, 1.0, 0.29, 1
animation_curve_opafadeout = 0.5, 0.5, 0.5, 0.5
animation_curve_opafadein = 0.46, 1.0, 0.29, 1



