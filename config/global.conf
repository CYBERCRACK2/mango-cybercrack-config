# autostart your favorite applications here
# DMS bar
#exec-once = dms run &
#dms daemon &
#exec = /home/cybercrack/.config/mango/init.sh
#exec-once = bash -c pkexec /home/cybercrack/.config/mango/retask2.sh
exec_once = bash -c wl-paste --watch cliphist store &  # optional: clipboard history | cliphist is needed


# Change your layout here for each workspace.
# tile, scroller, grid, deck, monocle, center_tile, vertical_tile, vertical_scroller, dwindle
tag_rule = id:1, layout_name: dwindle
tag_rule = id:2, layout_name: dwindle
tag_rule = id:3, layout_name: dwindle
tag_rule = id:4, layout_name: dwindle
tag_rule = id:5, layout_name: dwindle
tag_rule = id:6, layout_name: dwindle
tag_rule = id:7, layout_name: dwindle
tag_rule = id:8, layout_name: dwindle
tag_rule = id:9, layout_name: dwindle

# | Environment Variables |
# Set your environment variables here. | https://mangowm.github.io/docs/configuration/basics#environment-variables

#env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_QPA_PLATFORMTHEME,kde;qt6ct;qt5ct
env=QT_QPA_PLATFORMTHEME_QT6,qt6ct 
env=QT_QPA_PLATFORM,wayland;xcb
env=SDL_VIDEODRIVER,WAYLAND
env=XDG_SESSION_TYPE,wayland
env=XDG_CURRENT_DESKTOP,mango
# _JAVA_AWT_WM_NONREPARENTING "1"

# MOUSE
env=WLR_DRM_NO_ATOMIC,1
#env=WLR_NO_SOFTWARE_CURSORS,1
#env=WLR_RENDERER,gles2
#env=WLR_DRM_NO_MODIFIERS,1
#env=WLR_DRM_NO_DIRECT_SCANOUT,1

